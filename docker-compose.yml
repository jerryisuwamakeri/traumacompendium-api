services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      APP_PORT: 8080
      LOG_LEVEL: info
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: trauma_app
      DB_PASSWORD: trauma_app_dev_password
      DB_NAME: trauma_compendium
      REDIS_ADDR: redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      TERMII_MODE: sandbox
      SMTP_MODE: sandbox
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: trauma_compendium
      MYSQL_USER: trauma_app
      MYSQL_PASSWORD: trauma_app_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
